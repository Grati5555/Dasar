name: Filter IPTV Playlist

on:
  workflow_dispatch: # Tombol Run manual di tab Actions
  schedule:
    - cron: '0 */1 * * *' # Otomatis berjalan setiap 2 jam sekali

jobs:
  filter-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Filter Script
        run: python filter_playlist.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update and filter master_active.m3u"
          file_pattern: master_active.m3u
