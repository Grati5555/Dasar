name: Filter IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari jam 12 malam
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  filter-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Filter Script
        run: python filter_playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_active.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update and filter IPTV playlist" && git push)
