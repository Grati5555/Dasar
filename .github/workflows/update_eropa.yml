name: Auto Update Europa M3U

on:
  schedule:
    - cron: '30 */2 * * *' # Berjalan otomatis setiap 2 jam
  workflow_dispatch: # Bisa dijalankan manual kapan saja

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run automatic fetch and merge script
        run: python merge_eropa.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add eropa.m3u
          git commit -m "Auto-update eropa.m3u from s-eropa repository"
          git push
