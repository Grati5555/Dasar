name: Auto Update and Merge M3U

on:
  schedule:
    - cron: '0 */6 * * *' # Otomatis berjalan setiap 6 jam sekali
  workflow_dispatch: # Bisa dijalankan manual kapan saja

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib ada agar GitHub bisa menyimpan perubahan file
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Download latest M3U files from source
        run: |
          # Masukkan link raw file M3U milik orang lain di sini. 
          # Anda bisa menambahkan baris curl baru jika file sumbernya lebih dari satu.
          curl -o BeinAfc.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/refs/heads/inal-22/BeinAfc.m3u8"
          curl -o BeinSportFR10.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/refs/heads/inal-22/BeinSportFR10.m3u8"

      - name: Run merge script
        run: python merge.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update and merge playlists" && git push)
