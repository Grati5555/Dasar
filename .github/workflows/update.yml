name: Auto Update and Merge M3U

on:
  schedule:
    - cron: '0 */2 * * *' # Berjalan otomatis setiap 2 jam
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run automatic fetch and merge script
        run: python merge.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add master.m3u
          git commit -m "Auto-update master.m3u from remote repository"
          git push
