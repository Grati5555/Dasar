name: Auto Update and Merge M3U

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Download all M3U files from source
        run: |
          curl -o BeinAfc.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/main/BeinAfc.m3u8"
          curl -o BeinSportFR10.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/main/BeinSportFR10.m3u8"

      - name: Run merge script
        run: python merge.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update and merge playlists" && git push)
