name: Auto Update M3U

on:
  schedule:
    - cron: '0 */6 * * *' # Menjalankan otomatis setiap 6 jam sekali
  workflow_dispatch: # Memungkinkan Anda menjalankan update secara manual kapan saja

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download latest M3U files
        run: |
          # Contoh mengunduh file dari link raw orang lain dan menyimpannya ke repository Anda
          curl -o BeinAfc.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/refs/heads/inal-22/BeinAfc.m3u8"
          curl -o BeinAfc1.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/refs/heads/inal-22/BeinAfc1.m3u8"
          curl -o BeinAfc2.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/refs/heads/inal-22/BeinAfc2.m3u8"
          curl -o BeinAfc3.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/refs/heads/inal-22/BeinAfc3.m3u8"
          
          # Jika ada banyak file, Anda bisa menambahkan baris curl di bawahnya dengan format yang sama:
          # curl -o NamaFileLain.m3u8 "URL_RAW_FILE_LAINNYA"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update M3U from source" && git push)
