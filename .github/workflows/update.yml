name: Auto Update and Merge M3U

on:
  schedule:
    - cron: '0 */2 * * *' # Otomatis berjalan setiap 2 jam sekali
  workflow_dispatch: # Bisa dijalankan manual kapan saja

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar GitHub Actions bisa menyimpan file
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: setup-python@v4
        with:
          python-version: '3.x'

      - name: Download all M3U files from source
        run: |
          # Masukkan semua link Raw file sumber di sini (tambahkan baris curl sebanyak yang Anda mau)
          curl -o BeinAfc.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/main/BeinAfc.m3u8"
          curl -o BeinSportFR10.m3u8 "https://raw.githubusercontent.com/B-inal-123/bein-s/main/BeinSportFR10.m3u8"
          # Contoh jika ingin menambah file lain, tinggal ikuti format di bawah ini:
          # curl -o NamaFileLain.m3u8 "URL_RAW_FILE_LAINNYA"

      - name: Run merge script
        run: python merge.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update and merge playlists" && git push)
