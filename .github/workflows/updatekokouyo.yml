name: Auto Update KokoUyo Playlist

on:
  schedule:
    # Cek perubahan setiap 15 menit sekali secara otomatis tanpa menunggu lama
    - cron: '*/15 * * * *'
  workflow_dispatch: # Tombol manual tetap ada

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Merge Script
        run: python mergekokouyo.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MasterKokoUyo.m3u
          # Perintah ini memastikan git HANYA akan melakukan commit & push JIKA isi file MasterKokoUyo.m3u benar-benar berubah
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update MasterKokoUyo playlist (source changed) [skip ci]" && git push)
