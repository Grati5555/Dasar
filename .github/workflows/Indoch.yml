name: Auto Update IndoCh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: python IndoCh.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Sumber Indo/" sources.txt select_ch.txt PlaylistINDOpilihan.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update playlist pilihan [skip ci]" && git push)
