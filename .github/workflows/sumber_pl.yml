name: Auto Merge and Check Sumber_PL

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali (bisa diubah sesuai kebutuhan)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Memungkinkan tombol Run manual di tab Actions GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Python Merge Script
        run: python Folder_sumber.py

      - name: Commit and Push Master Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Sumber_PL.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Sumber_PL.m3u via GitHub Actions" && git push)
