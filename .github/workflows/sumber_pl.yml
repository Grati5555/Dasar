name: Auto Merge and Check IPTV

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'  # Berjalan otomatis setiap 6 jam sekali
  workflow_dispatch:      # Bisa dijalankan manual lewat tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Merge Script
        run: python Folder_sumber.py

      - name: Commit and Push Master Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update master_playlist.m3u (Checked & Merged)" && git push)
