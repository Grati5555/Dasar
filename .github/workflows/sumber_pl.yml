name: Auto Update and Merge Sumber_PL

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Tombol run manual di GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Python Auto-Update & Merge Script
        run: python Folder_sumber.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Sumber_PL/ Sumber_PL.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update source m3u and Sumber_PL.m3u" && git push)
