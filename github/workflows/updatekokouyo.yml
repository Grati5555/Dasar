name: Auto Update KokoUyo Playlist

on:
  schedule:
    # Otomatis update setiap 6 jam sekali
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Merge Script
        run: python mergekokouyo.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MasterKokoUyo.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update MasterKokoUyo playlist [skip ci]" && git push)
